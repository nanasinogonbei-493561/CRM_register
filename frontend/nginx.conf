server {
    listen 80;
    root /usr/share/nginx/html;

    # vite.config.ts の proxy と同じ動作: /api を外して backend に転送する
    location /api/ {
        # proxy_pass に固定のホスト名を書くと nginx は起動時に名前解決し、
        # backend が見つからないと起動に失敗する（再起動ループになる）。
        # 変数経由にしてリクエストのたびに Docker の内部 DNS で解決させる。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;

        # 変数を使う proxy_pass では末尾の / による「/api を外す」が効かないので、
        # rewrite で外す（クエリ文字列は rewrite が自動で引き継ぐ）
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    # React Router 用: 存在しないパスは index.html を返す
    location / {
        try_files $uri /index.html;
    }
}
