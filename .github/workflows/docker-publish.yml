name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GHCR に push するには packages: write が必要
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # GITHUB_TOKEN で GHCR にログインする（個人トークンは不要）
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグを自動生成する。main → latest、v1.2.0 → 1.2.0、加えてコミット SHA
      # リポジトリ名の大文字（CRM_register）は自動で小文字に直される
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
