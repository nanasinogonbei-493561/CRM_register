server {
    listen 80;
    root /usr/share/nginx/html;

    # vite.config.ts の proxy と同じ動作: /api を外して backend に転送する
    # proxy_pass の末尾の / が「/api を外す」役割を持つ
    location /api/ {
        proxy_pass http://backend:8080/;
    }

    # React Router 用: 存在しないパスは index.html を返す
    location / {
        try_files $uri /index.html;
    }
}
