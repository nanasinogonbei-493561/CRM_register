services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: crm
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    # nginx.conf が http://backend:8080 を参照するので、サービス名は backend 固定
    image: ghcr.io/nanasinogonbei-493561/crm_register-backend:latest
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://db:3306/crm
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/nanasinogonbei-493561/crm_register-frontend:latest
    # 外部公開は caddy が担当する（frontend はコンテナ間通信のみ）
    depends_on:
      - backend
    restart: unless-stopped

  # HTTPS 終端。Let's Encrypt の証明書を自動で取得・更新する
  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 証明書の保存先。消すと再発行になり、Let's Encrypt のレート制限に当たりうる
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
