services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: crm
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    # nginx.conf が http://backend:8080 を参照するので、サービス名は backend 固定
    image: ghcr.io/nanasinogonbei-493561/crm_register-backend:latest
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://db:3306/crm
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/nanasinogonbei-493561/crm_register-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
